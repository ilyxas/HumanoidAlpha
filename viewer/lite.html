<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Xandra-Lite</title>
    <link rel="stylesheet" href="observation.css">
    <link rel="stylesheet" href="lite.css">
    <script
        type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>

<body class="lite-mode">
    <canvas id="scene" aria-label="Xandra-Lite"></canvas>
    <canvas id="overlay" aria-hidden="true"></canvas>
    <time id="clock" aria-label="Local time"></time>
    <nav id="camera" aria-label="Camera">
        <button data-view="FRONT" aria-label="Front camera">FRONT</button>
        <button data-view="LEFT" aria-label="Left camera">LEFT</button>
        <button data-view="BACK" aria-label="Back camera">BACK</button>
        <button data-view="RIGHT" aria-label="Right camera">RIGHT</button>
        <button data-view="TOP" aria-label="Top camera">TOP</button>
        <button data-view="RESET" aria-label="Reset camera only">RESET</button>
        <button id="lock" aria-label="Lock camera" aria-pressed="false">LOCK</button>
        <button id="shot" aria-label="Screenshot">Screenshot</button>
    </nav>
    <section id="lite" aria-label="Xandra-Lite controls">
        <div class="lite-row">
            <button id="walk" aria-pressed="false" aria-label="Walk (hold W)">WALK</button>
            <button id="crouch" aria-pressed="false" aria-label="Crouch (C)">CROUCH</button>
            <button id="assist" aria-pressed="true" aria-label="Balance assist (A)">ASSIST ON</button>
            <button id="reset" aria-label="Reset stance (R)">RESET</button>
        </div>
        <div id="liteStatus" class="lite-status">connecting…</div>
        <div class="lite-hint">W hold = walk · C = crouch · R = reset · A = balance on/off · sticks / gamepad = 11 motors (L1/R1 cycle, like Harness). In stance the leg motors are absorbed by the planted feet.</div>
    </section>
    <div id="err" role="alert"></div>
    <div id="human" aria-label="Human control"></div>
    <script type="module" src="lite.js"></script>
</body>

</html>
